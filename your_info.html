<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="audioEvaluation_styling.css">
</head>
<body class = "info_page">
  <div class="info_container">
    <div class="info_header">
      <h1>Your details</h1>
    </div>
    <form>
      <p>Please fill in to start TTS Audio Evaluation</p>
      <hr>
      <label for="email"><b>Email</b></label>
      <input type="text" required>
  
      <label><b>Nationality</b></label>
      <input type="text" required>
  
      <label><b>Languages</b></label>

      <!-- as part of further development all languages should be added to the list-->
      <!-- used HTML Language Code References (https://www.w3schools.com/tags/ref_language_codes.asp) to get the relevant values for each language-->
        <select name="language">
            <option value="hr">Croatian</option>
            <option value="cs">Czech</option>
            <option value="da">Danish</option>
            <option value="nl">Dutch</option>
            <option value="en">English</option>
            <option value="la">Latin</option>
            <option value="lv">Latvian</option>
            <option value="lt">Lithuanian</option>
            <option value="pl">Polish</option>
            <option value="pt">Portuguese</option>
        </select>
      <hr>
      <button type="submit" class="submit_info" onclick="location.href='criteria_1.html'">
        Continue
      </button>
    </form>
  </div>
</body>
</html>
